<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Light theme: gold accent on parchment -->
  <!-- Dark theme: gold accent on near-black -->
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0a0a0a; }
        .accent { fill: #d4a574; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #faf8f3; }
        .accent { fill: #b8860b; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" class="bg"/>

  <!-- Neural network / brain concept -->
  <!-- Left lobe -->
  <circle cx="80" cy="85" r="28" class="accent" opacity="0.8"/>
  <!-- Right lobe -->
  <circle cx="176" cy="85" r="28" class="accent" opacity="0.8"/>
  <!-- Center top -->
  <circle cx="128" cy="65" r="22" class="accent" opacity="0.9"/>

  <!-- Lower neurons -->
  <circle cx="70" cy="160" r="18" class="accent" opacity="0.7"/>
  <circle cx="128" cy="175" r="18" class="accent" opacity="0.7"/>
  <circle cx="186" cy="160" r="18" class="accent" opacity="0.7"/>

  <!-- Connections (neural pathways) -->
  <line x1="80" y1="113" x2="70" y2="142" stroke="#d4a574" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <line x1="128" y1="87" x2="128" y2="157" stroke="#d4a574" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <line x1="176" y1="113" x2="186" y2="142" stroke="#d4a574" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <line x1="80" y1="113" x2="128" y2="87" stroke="#d4a574" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="176" y1="113" x2="128" y2="87" stroke="#d4a574" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
</svg>
